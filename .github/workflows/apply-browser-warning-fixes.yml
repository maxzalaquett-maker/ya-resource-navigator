name: Apply browser warning fixes

on:
  push:
    branches:
      - fix/form-image-warnings
    paths:
      - .github/workflows/apply-browser-warning-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/form-image-warnings
          fetch-depth: 0

      - name: Apply focused fixes
        run: python scripts/apply-browser-warning-fixes.py

      - name: Check JavaScript syntax
        run: |
          node --check phase1.js
          node --check logos.js
          node --check tests/e2e/smoke.spec.js

      - name: Confirm warning fixes are present
        run: |
          grep -q 'name="plan-status-' phase1.js
          grep -q 'name="plan-follow-up-' phase1.js
          grep -q 'image.width = 32' logos.js
          grep -q 'image.height = 32' logos.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1.js logos.js tests/e2e/smoke.spec.js
          git commit -m "Fix form and lazy image warnings"
          git push origin HEAD:fix/form-image-warnings
