name: Apply routing integration fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/routing-history'
    runs-on: ubuntu-latest
    steps:
      - name: Check out routing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect pending fix
        id: pending
        run: |
          if [ -f scripts/fix_routing_integration.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply integration fix
        if: steps.pending.outputs.apply == 'true'
        run: python scripts/fix_routing_integration.py

      - name: Remove one-time fix script
        if: steps.pending.outputs.apply == 'true'
        run: rm scripts/fix_routing_integration.py

      - name: Verify integration fix
        if: steps.pending.outputs.apply == 'true'
        run: |
          node --check config.js
          node --check app.js
          node --check route-state.js
          node --check tests/e2e/smoke.spec.js
          npm run test:unit

      - name: Commit integration fix
        if: steps.pending.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix routing state integration"
          git push origin HEAD:${{ github.head_ref }}
