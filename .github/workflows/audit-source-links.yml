name: Audit official source links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
  push:
    branches:
      - main
    paths:
      - data/resources.csv
      - data/support-data.json
      - data/source-url-overrides.json
      - scripts/audit_source_urls.py
      - scripts/build_data.py
      - scripts/apply_static_copy.py
      - scripts/normalize_app_data.py
      - config.js
      - .github/workflows/audit-source-links.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install link-audit dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Rebuild static data
        run: |
          python scripts/build_data.py
          python scripts/apply_static_copy.py
          python scripts/normalize_app_data.py

      - name: Audit source URLs
        run: python scripts/audit_source_urls.py

      - name: Commit audit results
        run: |
          if [[ -n "$(git status --porcelain -- data/app-data.json audits/source-url-audit.json audits/source-url-audit.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/app-data.json audits/source-url-audit.json audits/source-url-audit.md
            git commit -m "Update official source link audit"
            git push
          fi
