name: Audit official source links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
  push:
    branches:
      - main
    paths:
      - data/resources.csv
      - data/support-data.json
      - data/source-url-overrides.json
      - scripts/audit_source_urls.py
      - scripts/build_data.py
      - scripts/apply_static_copy.py
      - scripts/normalize_app_data.py
      - config.js
      - .github/workflows/audit-source-links.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install link-audit dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3

      - name: Rebuild static data
        run: |
          python scripts/build_data.py
          python scripts/apply_static_copy.py
          python scripts/normalize_app_data.py

      - name: Confirm generated data is committed
        run: git diff --exit-code -- data/app-data.json

      - name: Audit source URLs
        run: python scripts/audit_source_urls.py

      - name: Add audit summary
        run: cat audits/source-url-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: source-url-audit-${{ github.run_id }}
          path: |
            audits/source-url-audit.json
            audits/source-url-audit.md
          if-no-files-found: error
          retention-days: 30
