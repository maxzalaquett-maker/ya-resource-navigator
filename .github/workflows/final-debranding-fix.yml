name: Final debranding correction

on:
  push:
    paths:
      - .github/workflows/final-debranding-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct remaining page-shell references
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Charlotte Young Adult Resources & Foster Care Help | the program', 'Charlotte Young Adult Resources & Foster Care Help')
          text = text.replace('<img src="/assets/farm127-logo.png" alt="the program" width="88" height="71">', '<img src="/assets/resource-navigator-icon.svg" alt="" width="52" height="52">')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate page shell
        run: |
          node --check app.js
          node --check config.js
          ! grep -In -E 'FARM127|farm127-logo|\| the program|alt="the program"' index.html app.js config.js manifest.webmanifest data/app-data.json 404.html
          test -f assets/resource-navigator-icon.svg
          test -f source/Charlotte_Young_Adult_Resource_Directory.xlsx

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining debranding references"
          git push
