name: Fix debranding cleanup

on:
  push:
    paths:
      - .github/workflows/fix-debranding.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct debranding replacements
        run: |
          python <<'PY'
          from pathlib import Path

          fixes = {
              '404.html': [
                  ('Page not found | the program', 'Page not found | Resource Navigator'),
              ],
              'README.md': [
                  ('the the program Charlotte Young Adult Resource Directory workbook', 'the Charlotte Young Adult Resource Directory workbook'),
                  ('source/the program_Charlotte_Young_Adult_Resource_Directory.xlsx', 'source/Charlotte_Young_Adult_Resource_Directory.xlsx'),
              ],
              'config.js': [
                  ('const the program_TRIAGE_LINKS', 'const RESOURCE_NAVIGATOR_TRIAGE_LINKS'),
                  ('the program_TRIAGE_LINKS', 'RESOURCE_NAVIGATOR_TRIAGE_LINKS'),
                  ('a the program relationship', 'a directory relationship'),
                  ('the program does not list', 'The directory does not list'),
              ],
          }

          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # Clean awkward neutralized phrasing without reintroducing organization branding.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.html', '.js', '.json', '.css', '.md', '.csv', '.txt', '.xml', '.webmanifest', '.py'}:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('the the program', 'the program')
              text = text.replace('a the program', 'a program')
              text = text.replace('the program Resource Navigator', 'Charlotte Young Adult Resource Navigator')
              text = text.replace('the program Charlotte Young Adult Resource Directory', 'Charlotte Young Adult Resource Directory')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and branding removal
        run: |
          node --check app.js
          node --check config.js
          ! grep -RIn --exclude-dir=.git --exclude='*.xlsx' -E 'FARM127|const the program|the program_TRIAGE' .

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix debranding cleanup"
          git push
