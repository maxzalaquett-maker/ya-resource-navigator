name: Remove FARM127 branding

on:
  push:
    paths:
      - .github/workflows/remove-farm127-branding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependency
        run: python -m pip install --quiet openpyxl

      - name: Remove organization name and visual branding
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          from openpyxl import load_workbook

          root = Path('.')

          replacements = [
              ('FARM127_CONFIG', 'RESOURCE_NAVIGATOR_CONFIG'),
              ('farm127Action', 'recommendedAction'),
              ('farm127_action', 'recommended_action'),
              ('FARM127 Charlotte-Area Young Adult Resource Navigator', 'Charlotte-Area Young Adult Resource Navigator'),
              ('FARM127 Resource Database 2024', 'Charlotte Young Adult Resource Database'),
              ('FARM127 Resource Navigator', 'Charlotte Young Adult Resource Navigator'),
              ('FARM127 Resources', 'Young Adult Resources'),
              ('FARM127 team workspace', 'Resource directory workspace'),
              ('FARM127 action', 'Recommended next step'),
              ('FARM127 mentor', 'program mentor'),
              ('FARM127 mentorship', 'program mentorship'),
              ('FARM127 referrals', 'directory referrals'),
              ('FARM127 young adults', 'young adults'),
              ("FARM127's", "the program's"),
              ('FARM127', 'the program'),
          ]

          text_extensions = {'.html', '.js', '.json', '.css', '.md', '.csv', '.txt', '.xml', '.webmanifest', '.py'}
          excluded = {Path('.github/workflows/remove-farm127-branding.yml')}

          for path in root.rglob('*'):
              if not path.is_file() or path in excluded or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'^\s*<link rel="canonical"[^>]*>\s*\n', '', index, flags=re.MULTILINE)
          index = re.sub(r'^\s*<meta property="og:url"[^>]*>\s*\n', '', index, flags=re.MULTILINE)
          index = re.sub(r'^\s*<meta property="og:image"[^>]*>\s*\n', '', index, flags=re.MULTILINE)
          index = re.sub(r'^\s*<meta property="og:image:alt"[^>]*>\s*\n', '', index, flags=re.MULTILINE)
          index = re.sub(r'^\s*<meta name="twitter:image"[^>]*>\s*\n', '', index, flags=re.MULTILINE)
          index = index.replace('<meta name="theme-color" content="#4A3428">', '<meta name="theme-color" content="#1F2937">')
          index = index.replace('<link rel="icon" href="/assets/icon-192.png" type="image/png">', '<link rel="icon" href="/assets/resource-navigator-icon.svg" type="image/svg+xml">')
          index = index.replace('  <link rel="stylesheet" href="/brand-fonts.css">\n', '')
          index = re.sub(
              r'  <script type="application/ld\+json">.*?  </script>',
              '''  <script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "CollectionPage",\n    "name": "Charlotte Young Adult Resources & Foster Care Help",\n    "description": "A searchable Charlotte-area directory of housing, food, employment, education, healthcare, mental health, transportation, legal, life-skills, mentorship and foster-care resources for young adults.",\n    "spatialCoverage": {\n      "@type": "Place",\n      "name": "Charlotte and Mecklenburg County, North Carolina"\n    }\n  }\n  </script>''',
              index,
              flags=re.DOTALL,
          )
          index = index.replace('aria-label="the program resource navigator home"', 'aria-label="Resource navigator home"')
          index = re.sub(
              r'<img src="/assets/the program-logo\.png" alt="the program" width="88" height="71">',
              '<img src="/assets/resource-navigator-icon.svg" alt="" width="52" height="52">',
              index,
          )
          index = index.replace(
              '<p>the program maintains this directory as a practical starting point for young adults and the people helping them find trusted local support.</p>',
              '<p>This directory is a practical starting point for young adults and the people helping them find trusted local support.</p>',
          )
          index = index.replace(
              '<p>This directory is provided for general informational and referral purposes only. Inclusion does not mean the program endorses or guarantees a provider, and it does not mean a provider will accept a referral, have openings, offer a particular service, or determine someone eligible. Programs, eligibility, funding, service areas, contact information and availability can change without notice. the program does not control third-party providers or their decisions. Contact each provider directly to confirm current information and decide whether a resource is appropriate for your situation.</p>',
              '<p>This directory is provided for general informational and referral purposes only. Inclusion does not constitute an endorsement or guarantee of a provider, and it does not mean a provider will accept a referral, have openings, offer a particular service, or determine someone eligible. Programs, eligibility, funding, service areas, contact information and availability can change without notice. The directory does not control third-party providers or their decisions. Contact each provider directly to confirm current information and decide whether a resource is appropriate for your situation.</p>',
          )
          index = index.replace('/source/the program_Charlotte_Young_Adult_Resource_Directory.xlsx', '/source/Charlotte_Young_Adult_Resource_Directory.xlsx')
          index = re.sub(
              r'\s*<p><a href="https://www\.farm127\.org/">.*?</a></p>',
              '',
              index,
              flags=re.DOTALL,
          )
          index = index.replace('Bridging the gap between foster care and independent adulthood.', 'Connecting young adults with practical local support.')
          index_path.write_text(index, encoding='utf-8')

          manifest = '''{\n  "name": "Charlotte Young Adult Resource Navigator",\n  "short_name": "Young Adult Resources",\n  "description": "Charlotte-area resource directory for young adults.",\n  "start_url": "/#directory",\n  "display": "standalone",\n  "background_color": "#F8FAFC",\n  "theme_color": "#1F2937",\n  "icons": [\n    {\n      "src": "/assets/resource-navigator-icon.svg",\n      "sizes": "any",\n      "type": "image/svg+xml",\n      "purpose": "any"\n    }\n  ]\n}\n'''
          Path('manifest.webmanifest').write_text(manifest, encoding='utf-8')

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">\n  <title id="title">Resource Navigator</title>\n  <rect width="512" height="512" rx="112" fill="#1f2937"/>\n  <circle cx="256" cy="218" r="126" fill="none" stroke="#ffffff" stroke-width="28"/>\n  <path d="M256 116l42 94-42 112-42-112 42-94z" fill="#60a5fa" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>\n  <path d="M158 372h196" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>\n</svg>\n'''
          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          (assets / 'resource-navigator-icon.svg').write_text(svg, encoding='utf-8')

          for old_asset in ['farm127-logo.png', 'the program-logo.png', 'icon-192.png', 'icon-512.png']:
              path = assets / old_asset
              if path.exists():
                  path.unlink()

          brand_fonts = Path('brand-fonts.css')
          if brand_fonts.exists():
              brand_fonts.unlink()

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          color_replacements = {
              '#e9a928': '#2563eb',
              '#f8e8b9': '#dbeafe',
              '#4a3428': '#1f2937',
              '#f7f1e6': '#f8fafc',
              '#6f7b4b': '#0f766e',
              '#e7ecd8': '#ccfbf1',
              '#b86f45': '#475569',
              '#f2ded2': '#e2e8f0',
              '#d8e4df': '#e0f2fe',
              '#2f2924': '#111827',
              '#6f6862': '#64748b',
              '#ded4c8': '#cbd5e1',
              '#fffdf9': '#ffffff',
              '#38271e': '#111827',
              '#fffaf0': '#ffffff',
              'rgba(233, 169, 40,': 'rgba(37, 99, 235,',
              'rgba(47, 41, 36,': 'rgba(15, 23, 42,',
          }
          for old, new in color_replacements.items():
              styles = styles.replace(old, new)
          styles_path.write_text(styles, encoding='utf-8')

          old_book = Path('source/FARM127_Charlotte_Young_Adult_Resource_Directory.xlsx')
          if not old_book.exists():
              old_book = Path('source/the program_Charlotte_Young_Adult_Resource_Directory.xlsx')
          new_book = Path('source/Charlotte_Young_Adult_Resource_Directory.xlsx')
          if old_book.exists():
              wb = load_workbook(old_book)
              for ws in wb.worksheets:
                  for row in ws.iter_rows():
                      for cell in row:
                          if isinstance(cell.value, str):
                              value = cell.value
                              for old, new in replacements:
                                  value = value.replace(old, new)
                              cell.value = value
                  if hasattr(ws, '_images'):
                      ws._images = []
              for attr in ['title', 'subject', 'description', 'keywords', 'category']:
                  value = getattr(wb.properties, attr, None)
                  if isinstance(value, str):
                      for old, new in replacements:
                          value = value.replace(old, new)
                      setattr(wb.properties, attr, value)
              wb.save(new_book)
              if old_book != new_book and old_book.exists():
                  old_book.unlink()

          # Ensure public-facing source files contain no remaining organization name.
          public_files = [Path('index.html'), Path('app.js'), Path('manifest.webmanifest'), Path('data/app-data.json')]
          remaining = [str(path) for path in public_files if path.exists() and 'FARM127' in path.read_text(encoding='utf-8')]
          if remaining:
              raise SystemExit(f'Remaining FARM127 references: {remaining}')
          PY

      - name: Commit debranded navigator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove FARM127 name and branding"
          git push
