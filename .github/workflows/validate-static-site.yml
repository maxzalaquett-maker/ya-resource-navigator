name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild static resource data
        run: |
          python scripts/build_data.py
          python scripts/normalize_app_data.py

      - name: Commit rebuilt data on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- data/app-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/app-data.json
            git commit -m "Rebuild static resource descriptions"
            git push
          fi

      - name: Confirm generated data is committed in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/app-data.json

      - name: Assemble Phase 1 script
        run: cat phase1/part-*.txt > /tmp/phase1-runtime.js

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check filter-tooltips.js
          node --check mobile.js
          node --check phase1.js
          node --check site-structure.js
          node --check /tmp/phase1-runtime.js

      - name: Check JSON syntax
        run: |
          python -m json.tool data/app-data.json > /dev/null
          python -m json.tool data/pathways.json > /dev/null
