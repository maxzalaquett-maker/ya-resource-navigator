name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated files and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild static resource data
        run: |
          python scripts/build_data.py
          python scripts/apply_static_copy.py
          python scripts/normalize_app_data.py

      - name: Confirm generated data is committed
        run: git diff --exit-code -- data/app-data.json

      - name: Assemble Phase 1 script
        run: cat phase1/part-*.txt > /tmp/phase1-runtime.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          node --check /tmp/phase1-runtime.js
          node --check tests/e2e/smoke.spec.js

      - name: Check JSON syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" > /dev/null
          done < <(find data -type f -name '*.json' -print0 | sort -z)
          python -m json.tool package.json > /dev/null
          python -m json.tool manifest.webmanifest > /dev/null

  browser-smoke-tests:
    name: Browser smoke tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
